<!DOCTYPE html>
<html>
<head>
    <title>FC Napkin Math - Final Test</title>
    <style>
        #gems-tracker {
            margin: 12px 0;
            background: rgba(10, 10, 15, 0.92);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 16px 20px;
            min-width: 260px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            user-select: none;
            -webkit-user-select: none;
            transition: border-color 0.5s, box-shadow 0.5s;
        }

        #gems-tracker.fulfilled {
            border-color: #00e676;
            box-shadow: 0 0 24px rgba(0, 230, 118, 0.4);
        }

        #gems-tracker.fulfilled .tracker-remaining {
            color: #00e676;
            font-size: 30px;
        }

        #gems-tracker.fulfilled .perfect-text {
            color: #00e676;
        }

        .tracker-remaining {
            font-size: 28px;
            font-weight: 800;
            color: #ff5252;
            text-align: center;
            margin-top: 8px;
            transition: color 0.5s, font-size 0.3s;
            line-height: 1.2;
        }
    </style>
</head>
<body>
    <h2>Testing Implementation</h2>
    
    <p>This is a direct reproduction of how the functionality should work when collected = required:</p>
    
    <!-- Simulating the case where collected = required -->
    <div id="gems-tracker" class="fulfilled">
        <div class="tracker-remaining">
            <span class="perfect-text">Perfect</span>
        </div>
    </div>
    
    <p>You should see that "Perfect" text is green and the box has a green border.</p>
</body>
</html>
