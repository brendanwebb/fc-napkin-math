<!DOCTYPE html>
<html>
<head>
    <title>FC Napkin Math Test</title>
    <style>
        /* Gems progress bar - inserted inline below the SBC header */
        #gems-tracker {
          margin: 12px 0;
          background: rgba(10, 10, 15, 0.92);
          border: 2px solid #333;
          border-radius: 12px;
          padding: 16px 20px;
          min-width: 260px;
          font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
          user-select: none;
          -webkit-user-select: none;
          transition: border-color 0.5s, box-shadow 0.5s;
        }

        /* Allow selection on value elements */
        #gems-tracker .val,
        #gems-tracker .tracker-remaining {
          user-select: text;
          -webkit-user-select: text;
        }

        #gems-tracker.fulfilled {
          border-color: #00e676;
          box-shadow: 0 0 24px rgba(0, 230, 118, 0.4);
        }

        #gems-tracker.fulfilled .tracker-remaining {
          color: #00e676;
          font-size: 30px;
        }

        #gems-tracker.fulfilled .perfect-text {
          color: #00e676;
        }

        #gems-tracker .tracker-title {
          display: flex;
          align-items: center;
          gap: 8px;
          font-size: 15px;
          font-weight: 700;
          color: #c0c0c0;
          margin-bottom: 10px;
          letter-spacing: 0.3px;
        }

        #gems-tracker .tracker-bar-fill {
          height: 100%;
          background: linear-gradient(90deg, #ff9800, #ffc107);
          border-radius: 5px;
          transition: width 0.8s ease;
        }

        #gems-tracker .tracker-bar-fill.fulfilled {
          background: linear-gradient(90deg, #00e676, #69f0ae);
        }

        #gems-tracker .tracker-bar-track {
          width: 100%;
          height: 10px;
          background: rgba(255, 255, 255, 0.08);
          border-radius: 5px;
          overflow: hidden;
          margin-bottom: 10px;
        }

        #gems-tracker .tracker-row {
          display: flex;
          justify-content: space-between;
          font-size: 13px;
          color: #888;
          margin-bottom: 4px;
        }

        #gems-tracker .tracker-row .val {
          font-weight: 600;
          color: #e0e0e0;
        }

        #gems-tracker .tracker-remaining {
          font-size: 28px;
          font-weight: 800;
          color: #ff5252;
          text-align: center;
          margin-top: 8px;
          transition: color 0.5s, font-size 0.3s;
          line-height: 1.2;
        }

        #gems-tracker .tracker-remaining.over {
          color: #ffc107;
          font-size: 30px;
        }

        #gems-tracker .gems-word {
          font-weight: 400;
          font-size: 18px;
          color: #aaa;
        }
    </style>
</head>
<body>
    <h2>Test Page for FC Napkin Math - "Perfect" Highlighting</h2>
    
    <p>This demonstrates the functionality we're trying to implement:</p>
    
    <div id="gems-tracker">
      <div class="tracker-title"><span class="tracker-icon-wrap"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAACXBIWXMAAAsTAAALEwEAmpwYAAABlElEQVR4nJ2TPUvDUBTGfydS1aJtQdQOxV0c3NzFwUFpKqKICkWk4B98EhMnCwXJ2GgHcTExYqOgIig4iIu70hJFpD+33j6UvHjy5sF998N95x4QwEo7g3DkS8ZmWwR0e59t13VbLzAeB8GnOj72YlKJ4hOjM5PcVf65qyIgDpCz1vN11jTgFJx6+QX55HrFJwFQ8m50R803sD7k99i37eG2uZlOQF73L1n33WdM4KpP55vBq0f9jN7YtT5Xg77y6h78Vzr27xwIb69H8D89aXeC8fXk1uX8j+7Z3X7dJiB49Oz0GjK7c37vWQsM7pXVj48fA38Pfj37Dm8wFhEwAAAAAElFTkSuQmCC" width="16" height="16" style="vertical-align: middle; margin-right: 4px;" alt=""></span><span>FC Napkin Math</span></div>
      <div class="tracker-bar-track"><div class="tracker-bar-fill fulfilled"></div></div>
      <div class="tracker-row"><span>Collected</span><span class="val" id="gt-current">100</span></div>
      <div class="tracker-row"><span>Required</span><span class="val" id="gt-required">100</span></div>
      <div class="tracker-remaining fulfilled" id="gt-remaining">
        <span class="perfect-text">Perfect</span>
      </div>
    </div>

    <p>Try clicking the button below to toggle between normal and fulfilled states:</p>
    
    <button onclick="toggleState()">Toggle State (Normal/Fulfilled)</button>
    
    <script>
        function toggleState() {
            const tracker = document.getElementById('gems-tracker');
            const remaining = document.getElementById('gt-remaining');
            
            if (tracker.classList.contains('fulfilled')) {
                tracker.classList.remove('fulfilled');
                remaining.innerHTML = '0 <span class="gems-word">gems left</span>';
            } else {
                tracker.classList.add('fulfilled');
                remaining.innerHTML = '<span class="perfect-text">Perfect</span>';
            }
        }
    </script>
</body>
</html>
